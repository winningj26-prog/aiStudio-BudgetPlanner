name: Legacy Product 2 source validation (manual)

# Product 2 is disabled as an active product, but keep its source/tests
# available for migration work. Run this workflow manually when editing legacy code.
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
