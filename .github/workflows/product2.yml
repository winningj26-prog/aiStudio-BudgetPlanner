name: Product 2 validation

on:
  pull_request:
    paths:
      - 'product2/**'
      - '.github/workflows/product2.yml'
  push:
    branches: [main]
    paths:
      - 'product2/**'
      - '.github/workflows/product2.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
