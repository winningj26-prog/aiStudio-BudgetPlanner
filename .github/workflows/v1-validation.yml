name: V1 validation

on:
  push:
    branches:
      - main
      - v1-functional-completion
      - v1.1-deployment-readiness
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Production smoke test
        run: |
          NODE_ENV=production PORT=4173 GEMINI_API_KEY=MY_GEMINI_API_KEY npm start > /tmp/budget-planner-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/healthz > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/budget-planner-server.log
          exit 1
